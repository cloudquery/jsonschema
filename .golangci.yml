run:
  tests: true

output:
  print-issued-lines: false

linters:
  enable:
    - gocyclo
    - gocritic
    - goconst
    - dupl
    - unconvert
    - goimports
    - unused
    - govet
    - nakedret
    - errcheck
    - revive
    - ineffassign
    - unparam
    - gofmt

linters-settings:
  govet:
    enable:
      - shadow
  dupl:
    threshold: 100
  goconst:
    min-len: 8
    min-occurrences: 3
  gocyclo:
    min-complexity: 20
  gocritic:
    disabled-checks:
      - ifElseChain
  gofmt:
    rewrite-rules:
    - pattern:     'interface{}'
      replacement: 'any'
    - pattern:     'a[b:len(a)]'
      replacement: 'a[b:]'

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  exclude-use-default: false
  exclude-dirs:
    - resources
    - old
  exclude-files:
    - cmd/protopkg/main.go
  exclude-rules:
    # Legacy comment extraction relies on go/ast and go/doc APIs that are
    # deprecated but still functional; migrating to go/types is out of scope.
    - path: comment_extractor\.go
      linters:
        - staticcheck
      text: "SA1019"
  exclude:
    # Captured by errcheck.
    - "^(G104|G204):"
    # Very commonly not checked.
    - 'Error return value of .(.*\.Help|.*\.MarkFlagRequired|(os\.)?std(out|err)\..*|.*Close|.*Flush|os\.Remove(All)?|.*Print(f|ln|)|os\.(Un)?Setenv). is not checked'
    # Weird error only seen on Kochiku...
    - "internal error: no range for"
    - 'exported method `.*\.(MarshalJSON|UnmarshalJSON|URN|Payload|GoString|Close|Provides|Requires|ExcludeFromHash|MarshalText|UnmarshalText|Description|Check|Poll|Severity)` should have comment or be unexported'
    - "composite literal uses unkeyed fields"
    - 'declaration of "err" shadows declaration'
    - "by other packages, and that stutters"
    - "Potential file inclusion via variable"
    - "at least one file in a package should have a package comment"
    - "bad syntax for struct tag pair"
